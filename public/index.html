<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人D&D文字冒险游戏</title>
    <style>
        body {
            font-family: 'Georgia', '宋体', serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2c1810 0%, #4a3728 100%);
            color: #e8dcc0;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(20, 15, 10, 0.8);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #8b7355;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .game-area {
            display: flex;
            gap: 20px;
            height: 600px;
        }
        .narrative-panel {
            flex: 2;
            background: rgba(40, 30, 20, 0.8);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid #8b7355;
        }
        .control-panel {
            flex: 1;
            background: rgba(30, 25, 15, 0.8);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #8b7355;
        }
        .players-list {
            margin-bottom: 20px;
        }
        .player-card {
            background: rgba(50, 40, 30, 0.6);
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #c9a96e;
        }
        .action-form {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #c9a96e;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #8b7355;
            border-radius: 4px;
            background: rgba(60, 50, 40, 0.8);
            color: #e8dcc0;
            font-family: inherit;
        }
        button {
            background: linear-gradient(135deg, #8b7355 0%, #a0845c 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: linear-gradient(135deg, #a0845c 0%, #b8956a 100%);
            transform: translateY(-1px);
        }
        .narrative-entry {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(60, 50, 40, 0.4);
        }
        .narrative-timestamp {
            font-size: 0.8em;
            color: #a0845c;
            margin-bottom: 5px;
        }
        .hidden {
            display: none;
        }
        #gameSetup {
            text-align: center;
            padding: 40px;
        }
        .scenario-card {
            background: rgba(40, 30, 20, 0.8);
            border: 1px solid #8b7355;
            border-radius: 8px;
            padding: 20px;
            margin: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .scenario-card:hover {
            border-color: #c9a96e;
            background: rgba(50, 40, 30, 0.8);
        }
        .scenario-card.selected {
            border-color: #c9a96e;
            background: rgba(60, 50, 40, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ 多人D&D文字冒险游戏</h1>
            <p>基于大模型的历史题材角色扮演体验</p>
        </div>

        <div id="gameSetup">
            <h2>选择游戏模式</h2>
            <div>
                <button onclick="showCreateGame()">创建新游戏</button>
                <button onclick="showJoinGame()">加入游戏</button>
            </div>

            <div id="createGamePanel" class="hidden">
                <h3>创建新游戏</h3>
                <div id="scenarioSelection">
                    <div class="scenario-card" data-scenario="threeKingdoms">
                        <h4>《谋士的博弈》</h4>
                        <p>三国时期，公元220年</p>
                        <p>在襄阳这个兵家必争之地，运用政治手段影响大战结局</p>
                    </div>
                    <div class="scenario-card" data-scenario="samuraiHonor">
                        <h4>《荣誉之刃》</h4>
                        <p>日本战国，1570年</p>
                        <p>浪人在传统荣誉与现实生存间寻找平衡</p>
                    </div>
                </div>
                <button onclick="createGame()">创建游戏</button>
            </div>

            <div id="joinGamePanel" class="hidden">
                <h3>加入游戏</h3>
                <div class="form-group">
                    <label>游戏ID:</label>
                    <input type="text" id="joinGameId" placeholder="输入游戏ID">
                </div>
                <div class="form-group">
                    <label>角色名称:</label>
                    <input type="text" id="joinPlayerName" placeholder="输入角色名称">
                </div>
                <button onclick="joinGame()">加入游戏</button>
            </div>
        </div>

        <div id="gameInterface" class="hidden">
            <div class="game-area">
                <div class="narrative-panel">
                    <h3>📜 冒险叙述</h3>
                    <div id="narrativeContent"></div>
                </div>
                
                <div class="control-panel">
                    <div class="players-list">
                        <h3>👥 冒险团队</h3>
                        <div id="playersContent"></div>
                    </div>
                    
                    <div class="action-form">
                        <h3>⚔️ 行动选择</h3>
                        <div class="form-group">
                            <label>行动描述:</label>
                            <textarea id="actionDescription" rows="3" placeholder="描述你想要进行的行动..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>行动类型:</label>
                            <select id="actionType">
                                <option value="dialogue">对话交流</option>
                                <option value="exploration">探索行动</option>
                                <option value="strategy">策略行动</option>
                                <option value="combat">战斗行动</option>
                                <option value="social">社交活动</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>使用属性:</label>
                            <select id="actionAttribute">
                                <option value="strategy">战略</option>
                                <option value="eloquence">辩才</option>
                                <option value="knowledge">学识</option>
                                <option value="insight">洞察</option>
                                <option value="connections">人脉</option>
                            </select>
                        </div>
                        <button onclick="submitAction()">执行行动</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
